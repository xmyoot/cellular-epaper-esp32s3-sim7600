name: Source metadata consistency
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_sources.py
      - name: Scope of this check
        run: echo 'Metadata only. Hardware release remains blocked; see review/README.md.'
