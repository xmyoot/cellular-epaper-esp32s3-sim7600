name: Source metadata consistency
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_sources.py
      - run: python3 scripts/check_hardware.py
      - name: Scope of this check
        run: echo 'Source consistency and critical connection regressions only. Native CAD checks and physical validation remain separate gates.'
